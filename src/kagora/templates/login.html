{% extends "layout.html" %}
{% block col_class %}narrow{% endblock %}
{% block content %}
    <div class="card">
        <h1>Log in</h1>
        <form id="loginForm">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       required>
            </div>
            <button type="submit" class="btn-primary">Log in</button>
        </form>
        <div class="mt-3">
          <p>
            <a href="{{ url_for("forgot_password_page") }}">Forgot your password?</a>
          </p>
          <p class="mb-0">
            Don't have an account? <a href="{{ url_for("register_page") }}">Register here</a>
          </p>
        </div>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
    import { getErrorMessage, showModal } from '/static/js/utils.js';

    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const formData = new FormData(loginForm);

      try {
        // OAuth2PasswordRequestForm expects form data, not JSON
        const response = await fetch('/api/users/token', {
          method: 'POST',
          body: formData,
        });

        if (response.ok) {
          const data = await response.json();

          // Store token in localStorage
          localStorage.setItem('access_token', data.access_token);

          // Show success modal and redirect to home
          document.getElementById('successMessage').textContent =
            'Login successful!';
          showModal('successModal');

          document.getElementById('successModal').addEventListener('hidden.bs.modal', () => {
            window.location.href = '/';
          }, { once: true });
        } else {
          const error = await response.json();
          document.getElementById('errorMessage').textContent = getErrorMessage(error);
          showModal('errorModal');
        }
      } catch (error) {
        document.getElementById('errorMessage').textContent =
          'Network error. Please check your connection and try again.';
        showModal('errorModal');
      }
    });
    </script>
{% endblock scripts %}
