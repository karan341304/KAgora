 [project]
name = "kagora"
version = "0.1.0"
description = "A public square for ideas and posts"
readme = "README.md"
authors = [
    { name = "Karan341304", email = "kasumal341304@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "boto3>=1.43.118",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
kagora = "kagora:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
]
